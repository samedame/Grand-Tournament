name: signal-check
# Dispatched by the Cloudflare open-scheduler Worker: alert 15:50 ET, confirm 16:25 ET (weekdays).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: alert (pre-close) or confirm (final close, writes ledger)
        default: alert
permissions:
  contents: write
concurrency:
  group: signal-check
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Signal check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_ENV: ${{ vars.TRADIER_ENV || 'production' }}
        run: python src/signal_check.py "${{ inputs.mode || 'alert' }}"
      - name: Commit ledger
        run: |
          git config user.name "grand-tournament-bot"; git config user.email "noreply@users.noreply.github.com"
          git add ledger/ || true
          git diff --cached --quiet || (git commit -m "signal ledger $(date -u +%F) [skip ci]" && git pull --rebase -q && git push)
